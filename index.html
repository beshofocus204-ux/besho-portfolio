<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Besho Focus | Social Media Excellence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="main-glow"></div>
  <header>
    <div class="logo">Besho Focus</div>
    <nav class="nav-boxes">
      <a href="#services" class="nav-box" data-en="Services" data-ar="الخدمات">Services</a>
      <a href="#projects" class="nav-box" data-en="Work" data-ar="الأعمال">Work</a>
      <a href="#about" class="nav-box" data-en="About" data-ar="عنّا">About</a>
    </nav>
    <div class="controls">
      <a href="/admin/" class="admin-link" data-en="Admin" data-ar="الأدمن">Admin</a>
      <div class="toggle-container" id="langToggle">
        <span class="toggle-label">AR</span>
        <div class="toggle-switch"><div class="toggle-ball"></div></div>
      </div>
      <div class="toggle-container" id="themeToggle">
        <span class="toggle-label">🌙</span>
        <div class="toggle-switch"><div class="toggle-ball"></div></div>
      </div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-content">
        <h2 class="glow-text" data-en="Social Media Excellence" data-ar="إبداع السوشيال ميديا">Social Media Excellence</h2>
        <p data-en="We craft high-converting visual identities for brands that want to stand out." data-ar="نصنع هويات بصرية قوية للعلامات التجارية التي تسعى للتميز.">We craft high-converting visual identities for brands that want to stand out.</p>
        <a href="#projects" class="btn-main-glow" data-en="Explore Work" data-ar="استكشف أعمالنا">Explore Work</a>
      </div>
    </section>
    <section id="services" class="section-padding">
      <h3 class="section-title" data-en="Our Services" data-ar="خدماتنا">Our Services</h3>
      <div class="services-grid">
        <div class="service-card glass-box">
          <div class="icon">🎨</div>
          <h4 data-en="Social Media Design" data-ar="تصميم السوشيال ميديا">Social Media Design</h4>
        </div>
        <div class="service-card glass-box">
          <div class="icon">💎</div>
          <h4 data-en="Brand Identity" data-ar="الهوية البصرية">Brand Identity</h4>
        </div>
        <div class="service-card glass-box">
          <div class="icon">🚀</div>
          <h4 data-en="Ad Creatives" data-ar="تصاميم الإعلانات">Ad Creatives</h4>
        </div>
      </div>
    </section>
    <section id="projects" class="section-padding">
      <h3 class="section-title" data-en="Featured Work" data-ar="أبرز أعمالنا">Featured Work</h3>
      <div id="projects-container" class="projects-grid"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
