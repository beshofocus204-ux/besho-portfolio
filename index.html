<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Besho Focus | Social Media Excellence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <!-- تأثير الـ Glow الخلفي المتحرك -->
  <div class="bg-glow"></div>

  <header>
    <div class="logo">Besho Focus</div>
    <div class="controls">
      <a href="/admin/" class="admin-link" data-en="Admin" data-ar="لوحة التحكم">Admin</a>
      <div class="toggle-container" id="langToggle">
        <span class="toggle-label">AR</span>
        <div class="toggle-switch"><div class="toggle-ball"></div></div>
      </div>
      <div class="toggle-container" id="themeToggle">
        <span class="toggle-label">🌙</span>
        <div class="toggle-switch"><div class="toggle-ball"></div></div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h2 class="reveal-text" data-en="Social Media Excellence" data-ar="إبداع السوشيال ميديا">Social Media Excellence</h2>
        <p class="reveal-text-slow" data-en="We craft high-converting visual identities for brands that want to stand out." 
           data-ar="نصنع هويات بصرية قوية للعلامات التجارية التي تسعى للتميز.">
           We craft high-converting visual identities for brands that want to stand out.
        </p>
        <div class="cta-wrapper">
          <a href="#projects" class="btn-glow" data-en="Explore Work" data-ar="استكشف أعمالنا">Explore Work</a>
        </div>
      </div>
    </section>

    <section id="projects" class="section-padding">
      <h3 class="section-title glow-text" data-en="Featured Work" data-ar="أبرز أعمالنا">Featured Work</h3>
      <div id="projects-container" class="projects-grid">
        <!-- المشاريع ستظهر هنا بتأثيرات Hover قوية -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
