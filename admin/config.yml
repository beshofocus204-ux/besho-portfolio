backend:
  name: git-gateway
  branch: main # تأكد إنه نفس اسم البرانش بتاعك

media_folder: "projects/images" # المكان اللي الصور هتتحفظ فيه
public_folder: "/projects/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "projects/data" # المكان اللي بيانات المشاريع هتتحفظ فيه
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Project Image", name: "image", widget: "image" }
